name: Playwright Dynamic Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test Suite to execute'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
      run_type:
        description: 'Run Type'
        required: true
        default: 'initial'
        type: choice
        options:
          - initial
          - rerun
      run_id:
        description: 'Previous Run ID (Required for Rerun)'
        required: false
        type: string

jobs:
  discover:
    name: Discover Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Discover Initial Tests
        if: github.event.inputs.run_type == 'initial'
        id: discover-initial
        run: |
          MATRIX=$(npx tsx scripts/discover-tests.ts ${{ github.event.inputs.suite }})
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
      - name: Discover Failed Tests
        if: github.event.inputs.run_type == 'rerun'
        id: discover-failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ github.event.inputs.run_id }}" ]; then
            echo "Error: run_id is required for rerun."
            exit 1
          fi
          # Download the previous final-blob-reports, or fallback to blob-reports
          gh run download ${{ github.event.inputs.run_id }} -n final-blob-reports -D previous-blob-reports || gh run download ${{ github.event.inputs.run_id }} -n blob-reports -D previous-blob-reports
          MATRIX=$(npx tsx scripts/discover-failed.ts previous-blob-reports)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
      - name: Set Matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.run_type }}" == "initial" ]; then
            echo "matrix=${{ steps.discover-initial.outputs.matrix }}" >> $GITHUB_OUTPUT
          else
            echo "matrix=${{ steps.discover-failed.outputs.matrix }}" >> $GITHUB_OUTPUT
          fi

  execute:
    name: Execute Test
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Test
        run: |
          npx cross-env PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report npx playwright test ${{ matrix.test }} --reporter=blob
      - name: Upload Blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-reports
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore

  merge:
    name: Merge Reports
    needs: execute
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Download new blobs
        uses: actions/download-artifact@v4
        with:
          name: blob-reports
          path: blob-reports
      - name: Handle Rerun Merge
        if: github.event.inputs.run_type == 'rerun'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.inputs.run_id }} -n final-blob-reports -D previous-blob-reports || gh run download ${{ github.event.inputs.run_id }} -n blob-reports -D previous-blob-reports
          npx tsx scripts/ci-merge-and-replace.ts previous-blob-reports blob-reports final-blob-reports
      - name: Use Initial Blobs
        if: github.event.inputs.run_type == 'initial'
        run: |
          mv blob-reports final-blob-reports
      - name: Merge into HTML Report
        run: npx playwright merge-reports ./final-blob-reports --reporter=html
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload Final Blobs for future reruns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-blob-reports
          path: final-blob-reports
          retention-days: 7
