name: Playwright Dynamic Pipeline

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test Suite to execute'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
      run_type:
        description: 'Run Type'
        required: true
        default: 'initial'
        type: choice
        options:
          - initial
          - rerun
      run_id:
        description: 'Previous Run ID (Required for Rerun)'
        required: false
        type: string

jobs:
  discover:
    name: Discover Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache node_modules — skips npm ci if package-lock.json unchanged
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Discover Initial Tests does NOT need browsers — skip playwright install here
      - name: Discover Initial Tests
        if: github.event.inputs.run_type == 'initial'
        run: npx tsx scripts/discover-tests.ts ${{ github.event.inputs.suite }}

      - name: Discover Failed Tests
        if: github.event.inputs.run_type == 'rerun'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ github.event.inputs.run_id }}" ]; then
            echo "Error: run_id is required for rerun."
            exit 1
          fi
          gh run download ${{ github.event.inputs.run_id }} -n final-blob-reports -D previous-blob-reports \
            || gh run download ${{ github.event.inputs.run_id }} -n blob-reports -D previous-blob-reports
          npx tsx scripts/discover-failed.ts previous-blob-reports

      - name: Set Matrix Output
        id: set-matrix
        run: |
          echo "Discovered matrix: $(cat matrix.json)"
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  execute:
    name: Execute Test
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != 'null' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers — biggest time saver (~22s saved per job)
      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system deps (cached browsers)
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Test
        run: |
          npx cross-env PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report npx playwright test "${{ matrix.test }}" --reporter=blob

      - name: Upload Blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true  # allows re-run of failed jobs to replace old blob

  merge:
    name: Merge Reports
    needs: [discover, execute]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Download all blobs
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: blob-reports
          merge-multiple: true

      - name: Handle Rerun Merge
        if: github.event.inputs.run_type == 'rerun'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.inputs.run_id }} -n final-blob-reports -D previous-blob-reports \
            || gh run download ${{ github.event.inputs.run_id }} -n blob-reports -D previous-blob-reports
          npx tsx scripts/ci-merge-and-replace.ts previous-blob-reports blob-reports final-blob-reports

      - name: Use Initial Blobs
        if: github.event.inputs.run_type == 'initial'
        run: mv blob-reports final-blob-reports

      - name: Merge into HTML Report
        run: npx playwright merge-reports ./final-blob-reports --reporter=html

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload Final Blobs for future reruns
        uses: actions/upload-artifact@v4
        with:
          name: final-blob-reports
          path: final-blob-reports
          retention-days: 7
